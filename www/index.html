<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NPN - GPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="ai.css">


<script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.js"></script>
</head>
<body>




<div class="topbar">
  <div class="brand-title">
    <span class="brand-npn">NPN</span>
    <span class="brand-dash">-</span>
    <span class="brand-gpt">GPT</span>
  </div>
  <div class="topbar-right">
    <button class="topbar-btn" id="btnModel" title="Chọn model">
      <span class="m-dot"></span>
      <span class="m-name" id="currentModelName">openai/gpt-oss-120b</span>
    </button>
    <button class="topbar-btn" id="btnContact" title="Liên hệ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="btn-label">Liên hệ</span>
    </button>
  </div>
</div>


<div class="workspace">
  <div class="main" id="mainArea"></div>
</div>


<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">Xác nhận</h3>
    <p id="modalMsg">Bạn có chắc không?</p>
    <div class="modal-box-actions">
      <button class="btn-cancel" id="modalCancel">Huỷ</button>
      <button class="btn-ok" id="modalOk">Đồng ý</button>
    </div>
  </div>
</div>


<div class="modal-overlay" id="contactOverlay">
  <div class="contact-modal-box">
    <div class="contact-modal-head">
      <div class="contact-modal-title"><span class="ico">💬</span> Liên hệ</div>
      <button class="contact-modal-close" id="contactModalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="contact-modal-body">
      <a class="contact-item" href="https://www.facebook.com/dung.dong.1655?mibextid=wwXIfr&mibextid=wwXIfr" target="_blank" rel="noopener">
        <div class="contact-icon fb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></div>
        <div class="contact-body"><div class="contact-name">Facebook ADMIN</div><div class="contact-handle">Nguyễn Phi Nhật</div></div>
        <div class="contact-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></div>
      </a>
      <a class="contact-item" href="https://www.tiktok.com/@raicanmixo?_r=1&_t=ZS-98bfoKvXGFg" target="_blank" rel="noopener">
        <div class="contact-icon tiktok"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg></div>
        <div class="contact-body"><div class="contact-name">TikTok ADMIN</div><div class="contact-handle">@raicanmixo</div></div>
        <div class="contact-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></div>
      </a>
    </div>
  </div>
</div>


<div class="modal-overlay" id="modelPickerOverlay">
  <div class="model-picker-box">
    <div class="model-picker-head">
      <div class="model-picker-title"><span class="ico">🤖</span> Chọn Model AI <span class="model-picker-sub">free tier</span></div>
      <button class="contact-modal-close" id="modelPickerClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="model-picker-filters" id="modelPickerFilters">
      <button class="model-filter-chip active" data-filter="all">Tất cả</button>
      <button class="model-filter-chip" data-filter="chat">💬 Chat</button>
      <button class="model-filter-chip" data-filter="vision">👁️ Vision</button>
      <button class="model-filter-chip" data-filter="reasoning">🧠 Reasoning</button>
      <button class="model-filter-chip" data-filter="compound">⚡ Compound</button>
      <button class="model-filter-chip" data-filter="guard">🛡️ Guard</button>
      <button class="model-filter-chip" data-filter="audio">🎤 Audio</button>
    </div>
    <div class="model-picker-body" id="modelPickerBody">
      <div class="model-picker-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang quét model free từ Groq...</div>
    </div>
    <div class="model-picker-foot">
      <span id="modelPickerCount">0 model</span>
      <button class="model-refresh-btn" id="modelRefreshBtn"><i class="fa-solid fa-rotate"></i> Quét lại</button>
    </div>
  </div>
</div>


<div class="modal-overlay" id="historyOverlay">
  <div class="history-modal-box">
    <div class="history-modal-head">
      <div class="history-modal-title"><span class="ico">💬</span> Lịch sử chat</div>
      <div class="history-modal-actions">
        <button class="history-clear-all" id="btnClearAll">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Xoá hết
        </button>
        <button class="contact-modal-close" id="historyModalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="history-modal-body" id="historyList"></div>
  </div>
</div>

<!-- LYRA -->
<div class="lyra-container" id="lyraContainer">
  <div class="lyra-video-wrap">
    <video id="lyraVideo" autoplay muted playsinline loop>
      <source src="Lyra.mp4" type="video/mp4" />
      Không tìm thấy Lyra.mp4
    </video>
    <div class="lyra-gradient"></div>
    <div class="lyra-bubble" id="lyraBubble">
      <div class="bubble-main" id="lyraBubbleMain">Chào bạn! ✨</div>
      <div class="bubble-sub" id="lyraBubbleSub">Bé Lyra đây, rất vui được gặp bạn!</div>
    </div>
  </div>
  <div class="lyra-input-area">
    <input type="text" id="lyraInput" placeholder="💬 Nhắn tin với bé Lyra..." />
    <button class="lyra-send" id="lyraSendBtn">Gửi ➤</button>
  </div>
  <button class="lyra-close-btn" id="lyraCloseBtn">✕ Đóng</button>
</div>


<div class="youtube-tab-container" id="youtubeTabContainer"></div>


<div class="toast-stack" id="toastStack"></div>

<script src="ai.js"></script>
</body>
</html>
